<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraCast Listener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg: #0a0d14;
      --card: #121826;
      --card-inner: #1a2336;
      --primary: #10b981;
      --primary-hover: #059669;
      --warning: #f59e0b;
      --warning-hover: #d97706;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }

    input[type="text"] {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      width: 100%;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-mute {
      background: var(--warning);
    }
    .btn-mute:hover { background: var(--warning-hover); }

    .btn-muted-active {
      background: var(--danger) !important;
    }

    .controls-panel {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .status-badge {
      font-size: 0.8125rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      text-align: center;
      padding: 4px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Listener Hub</h2>
    
    <input type="text" id="room-input" placeholder="Enter Speaker Room ID (e.g. aura-xxxxxx)" />
    
    <div class="btn-group">
      <button id="btn-listen" onclick="startListeningFlow()">Start Listening</button>
      <button id="btn-mute" class="btn-mute" onclick="toggleMute()" disabled>Mute Voice</button>
    </div>

    <div class="controls-panel">
      <div class="volume-row">
        <span>Volume:</span>
        <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)" />
        <span id="vol-readout" style="width: 38px; text-align: right;">100%</span>
      </div>
    </div>

    <div id="status-text" class="status-badge">Status: Initializing Peer...</div>
    <audio id="remote-audio" autoplay playsinline></audio>
  </div>

  <script>
    let peer = null;
    let currentCall = null;
    let isMuted = false;
    let autoReconnectTimer = null;
    let isManualDisconnect = false;

    const player = document.getElementById('remote-audio');
    const muteBtn = document.getElementById('btn-mute');
    const listenBtn = document.getElementById('btn-listen');
    const statusText = document.getElementById('status-text');

    function initListenerPeer() {
      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }

      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', () => {
        statusText.innerText = 'Status: Ready to connect';
      });

      peer.on('error', (err) => {
        statusText.innerText = 'Status: Peer Error (' + err.type + ')';
        scheduleReconnect();
      });

      peer.on('disconnected', () => {
        statusText.innerText = 'Status: Peer Server Disconnected. Re-establishing...';
        try { peer.reconnect(); } catch(e){}
      });
    }

    function startListeningFlow() {
      isManualDisconnect = false;
      connectToSpeaker();
    }

    function createHandshakeStream() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      gain.gain.value = 0;
      osc.connect(gain);
      const dest = ctx.createMediaStreamDestination();
      gain.connect(dest);
      osc.start();
      return dest.stream;
    }

    function connectToSpeaker() {
      const roomId = document.getElementById('room-input').value.trim();
      if (!roomId) return alert('Enter the Room ID from the Calculator app');

      clearTimeout(autoReconnectTimer);
      statusText.innerText = 'Connecting to ' + roomId + '...';

      const dummyStream = createHandshakeStream();
      const call = peer.call(roomId, dummyStream);
      currentCall = call;

      call.on('stream', (remoteStream) => {
        player.srcObject = remoteStream;
        player.muted = isMuted;

        player.play().then(() => {
          updateStreamingStatus();
        }).catch(() => {
          statusText.innerText = 'Status: Tap button below to enable sound';
          listenBtn.innerText = 'Enable Sound';
          listenBtn.disabled = false;
          listenBtn.onclick = () => {
            player.play();
            updateStreamingStatus();
            listenBtn.innerText = 'Connected';
            listenBtn.disabled = true;
          };
        });

        muteBtn.disabled = false;
        listenBtn.innerText = 'Connected';
        listenBtn.disabled = true;

        // Monitor connection drops & recover automatically
        if (call.peerConnection) {
          call.peerConnection.onconnectionstatechange = () => {
            const state = call.peerConnection.connectionState;
            if (state === 'disconnected' || state === 'failed') {
              scheduleReconnect();
            }
          };
        }
      });

      call.on('close', () => {
        scheduleReconnect();
      });

      call.on('error', (err) => {
        statusText.innerText = 'Status: Call Error (' + err + ')';
        scheduleReconnect();
      });
    }

    function scheduleReconnect() {
      if (isManualDisconnect) return;

      statusText.innerText = 'Status: Interrupted. Auto-reconnecting in 2s... 🟡';
      muteBtn.disabled = true;
      listenBtn.disabled = false;
      listenBtn.innerText = 'Reconnecting...';

      clearTimeout(autoReconnectTimer);
      autoReconnectTimer = setTimeout(() => {
        connectToSpeaker();
      }, 2000);
    }

    function updateStreamingStatus() {
      if (isMuted) {
        statusText.innerText = 'Status: Connected (Audio Muted) 🔇';
      } else {
        statusText.innerText = 'Status: Connected & Streaming 🟢';
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      player.muted = isMuted;

      if (isMuted) {
        muteBtn.innerText = 'Unmute Voice';
        muteBtn.classList.add('btn-muted-active');
        statusText.innerText = 'Status: Connected (Audio Muted) 🔇';
      } else {
        muteBtn.innerText = 'Mute Voice';
        muteBtn.classList.remove('btn-muted-active');
        statusText.innerText = 'Status: Connected & Streaming 🟢';
      }
    }

    function setVolume(val) {
      player.volume = val;
      document.getElementById('vol-readout').innerText = Math.round(val * 100) + '%';
    }

    window.onload = initListenerPeer;
  </script>
</body>
</html>
