<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraCast — Continuous Listener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg: #0a0d14;
      --card: #121826;
      --card-inner: #1a2336;
      --primary: #10b981;
      --primary-hover: #059669;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }

    input[type="text"] {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      width: 100%;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    .btn-group { display: flex; gap: 10px; }
    button {
      flex: 1;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-mute { background: var(--warning); }
    .btn-muted-active { background: var(--danger) !important; }

    .controls-panel {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .volume-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--text-muted); }
    input[type="range"] { flex: 1; accent-color: var(--primary); cursor: pointer; }
    .status-badge { font-size: 0.8125rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Persistent Listener Hub</h2>
    
    <input type="text" id="room-input" placeholder="Enter Room ID (e.g. aura-xxxxxx)" />
    
    <div class="btn-group">
      <button id="btn-listen" onclick="startPermanentConnection()">Connect & Lock</button>
      <button id="btn-mute" class="btn-mute" onclick="toggleMute()" disabled>Mute Voice</button>
    </div>

    <div class="controls-panel">
      <div class="volume-row">
        <span>Volume:</span>
        <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)" />
        <span id="vol-readout" style="width: 38px; text-align: right;">100%</span>
      </div>
    </div>

    <div id="status-text" class="status-badge">Status: Initializing Mesh...</div>
    <audio id="remote-audio" autoplay playsinline></audio>
  </div>

  <script>
    let peer = null;
    let activeCall = null;
    let isMuted = false;
    let targetRoomId = '';
    let watchdogTimer = null;
    let isConnected = false;
    let probeIndex = 0;

    const player = document.getElementById('remote-audio');
    const muteBtn = document.getElementById('btn-mute');
    const lockBtn = document.getElementById('btn-listen');
    const statusText = document.getElementById('status-text');

    const ICE_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
      ],
      iceCandidatePoolSize: 10,
      iceTransportPolicy: 'all'
    };

    function initListenerPeer() {
      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }

      peer = new Peer({
        config: ICE_CONFIG,
        debug: 1
      });

      peer.on('open', () => {
        statusText.innerText = 'Status: Signaling Ready 🟢';
      });

      peer.on('disconnected', () => {
        if (!peer.destroyed) peer.reconnect();
      });

      peer.on('error', (err) => {
        statusText.innerText = 'Signaling Status: ' + err.type;
      });
    }

    function startPermanentConnection() {
      targetRoomId = document.getElementById('room-input').value.trim();
      if (!targetRoomId) return alert('Enter Room ID');

      lockBtn.innerText = 'Locked 🟢';
      lockBtn.disabled = true;

      connectSweep();

      if (!watchdogTimer) {
        watchdogTimer = setInterval(() => {
          if (!isConnected || !activeCall || !activeCall.open) {
            probeIndex = (probeIndex + 1) % 6;
            connectSweep();
          }
        }, 2000);
      }
    }

    function connectSweep() {
      if (!peer || peer.destroyed) {
        initListenerPeer();
        return;
      }

      const activeTarget = probeIndex === 0 ? targetRoomId : `${targetRoomId}_${probeIndex}`;

      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      gain.gain.value = 0;
      osc.connect(gain);
      const dest = ctx.createMediaStreamDestination();
      gain.connect(dest);
      osc.start();

      const call = peer.call(activeTarget, dest.stream);
      if (!call) return;

      activeCall = call;

      call.on('stream', (remoteStream) => {
        isConnected = true;
        player.srcObject = remoteStream;
        player.muted = isMuted;

        player.play().then(() => {
          statusText.innerText = 'Status: Connected & Streaming 🟢';
        }).catch(() => {
          statusText.innerText = 'Status: Tap screen to enable audio';
          document.body.onclick = () => { player.play(); };
        });

        muteBtn.disabled = false;
      });

      if (call.peerConnection) {
        const pc = call.peerConnection;

        pc.oniceconnectionstatechange = () => {
          if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
            isConnected = false;
            try { pc.restartIce(); } catch (e) {}
          } else if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
            isConnected = true;
            statusText.innerText = 'Status: Connected & Streaming 🟢';
          }
        };
      }

      call.on('close', () => { isConnected = false; });
      call.on('error', () => { isConnected = false; });
    }

    function toggleMute() {
      isMuted = !isMuted;
      player.muted = isMuted;

      if (isMuted) {
        muteBtn.innerText = 'Unmute Voice';
        muteBtn.classList.add('btn-muted-active');
        statusText.innerText = 'Status: Connected (Audio Muted) 🔇';
      } else {
        muteBtn.innerText = 'Mute Voice';
        muteBtn.classList.remove('btn-muted-active');
        statusText.innerText = 'Status: Connected & Streaming 🟢';
      }
    }

    function setVolume(val) {
      player.volume = val;
      document.getElementById('vol-readout').innerText = Math.round(val * 100) + '%';
    }

    window.onload = initListenerPeer;
  </script>
</body>
</html>
