<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraCast — Resilient Listener</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg: #0a0d14;
      --card: #121826;
      --primary: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
    input[type="text"] { background: #1a2336; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; color: #fff; font-size: 1rem; outline: none; width: 100%; }
    .btn-group { display: flex; gap: 10px; }
    button { flex: 1; background: var(--primary); color: #fff; font-weight: 600; border: none; border-radius: 10px; padding: 14px; font-size: 0.95rem; cursor: pointer; }
    .btn-mute { background: var(--warning); }
    .btn-muted-active { background: var(--danger) !important; }
    .status-badge { font-size: 0.8125rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Persistent Listener Hub</h2>
    <input type="text" id="room-input" placeholder="Enter Room ID (e.g. aura-xxxxxx)" />
    
    <div class="btn-group">
      <button id="btn-listen" onclick="startConnectionLoop()">Connect</button>
      <button id="btn-mute" class="btn-mute" onclick="toggleMute()" disabled>Mute Voice</button>
    </div>

    <div id="status-text" class="status-badge">Status: Idle</div>
    <audio id="remote-audio" autoplay playsinline></audio>
  </div>

  <script>
    let peer = null;
    let currentCall = null;
    let isMuted = false;
    let autoReconnectInterval = null;
    let targetRoomId = '';

    const player = document.getElementById('remote-audio');
    const muteBtn = document.getElementById('btn-mute');
    const statusText = document.getElementById('status-text');

    function initPeer() {
      if (peer) {
        try { peer.destroy(); } catch(e) {}
      }

      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', () => {
        statusText.innerText = 'Status: Signaling Ready';
      });

      peer.on('error', (err) => {
        statusText.innerText = 'Peer Error: ' + err.type;
      });
    }

    function startConnectionLoop() {
      targetRoomId = document.getElementById('room-input').value.trim();
      if (!targetRoomId) return alert('Enter Room ID');

      establishCall();

      // Periodic check: If connection drops due to call interruption or network switch, auto-reconnect
      if (!autoReconnectInterval) {
        autoReconnectInterval = setInterval(() => {
          if (!currentCall || !currentCall.open) {
            statusText.innerText = 'Connection lost. Reconnecting...';
            establishCall();
          }
        }, 5000);
      }
    }

    function establishCall() {
      if (!peer || peer.destroyed) {
        initPeer();
        return;
      }

      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      gain.gain.value = 0;
      osc.connect(gain);
      const dest = ctx.createMediaStreamDestination();
      gain.connect(dest);
      osc.start();

      const call = peer.call(targetRoomId, dest.stream);
      if (!call) return;

      call.on('stream', (remoteStream) => {
        player.srcObject = remoteStream;
        player.muted = isMuted;
        player.play().then(() => {
          statusText.innerText = 'Status: Connected & Streaming 🟢';
        }).catch(() => {
          statusText.innerText = 'Status: Audio Locked (Tap Screen)';
          document.body.onclick = () => { player.play(); };
        });

        muteBtn.disabled = false;
        document.getElementById('btn-listen').disabled = true;
      });

      call.on('close', () => {
        statusText.innerText = 'Stream interrupted. Retrying...';
      });

      call.on('error', () => {
        statusText.innerText = 'Reconnecting...';
      });

      currentCall = call;
    }

    function toggleMute() {
      isMuted = !isMuted;
      player.muted = isMuted;
      muteBtn.innerText = isMuted ? 'Unmute Voice' : 'Mute Voice';
      muteBtn.classList.toggle('btn-muted-active', isMuted);
    }

    window.onload = initPeer;
  </script>
</body>
</html>
