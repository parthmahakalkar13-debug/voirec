<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraCast — Live Video & Audio Listener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg: #0a0d14;
      --card: #121826;
      --card-inner: #1a2336;
      --primary: #10b981;
      --primary-hover: #059669;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    
    .container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }

    .video-viewport {
      width: 100%;
      height: 380px;
      background: #000;
      border-radius: 14px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .video-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--primary);
    }

    input[type="text"] {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      width: 100%;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    .btn-group { display: flex; gap: 10px; }

    button {
      flex: 1;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-mute { background: var(--warning); }
    .btn-muted-active { background: var(--danger) !important; }

    .controls-panel {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input[type="range"] { flex: 1; accent-color: var(--primary); }
    .status-badge { font-size: 0.8125rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Listener Hub (Live Audio & Video)</h2>

    <div class="video-viewport">
      <video id="remote-video" autoplay playsinline></video>
      <div id="stream-overlay" class="video-overlay">READY</div>
    </div>

    <input type="text" id="room-input" placeholder="Enter Room ID (e.g. aura-xxxxxx)" />

    <div class="btn-group">
      <button id="btn-listen" onclick="connectToSpeaker()">Start Watching & Listening</button>
      <button id="btn-mute" class="btn-mute" onclick="toggleMute()" disabled>Mute Sound</button>
    </div>

    <div class="controls-panel">
      <span>Volume:</span>
      <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)" />
      <span id="vol-readout" style="width: 38px; text-align: right;">100%</span>
    </div>

    <div id="status-text" class="status-badge">Status: Initializing Peer...</div>
  </div>

  <script>
    let peer = null;
    let isMuted = false;
    const videoElement = document.getElementById('remote-video');
    const muteBtn = document.getElementById('btn-mute');
    const overlay = document.getElementById('stream-overlay');

    function initListenerPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', () => {
        document.getElementById('status-text').innerText = 'Status: Ready to connect';
      });

      peer.on('error', (err) => {
        document.getElementById('status-text').innerText = 'Status: Error (' + err.type + ')';
      });
    }

    function createEmptyOfferStream() {
      const canvas = document.createElement('canvas');
      canvas.width = 320;
      canvas.height = 240;
      const ctx = canvas.getContext('2d');
      ctx.fillRect(0, 0, 320, 240);
      const vStream = canvas.captureStream(1);

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0;
      osc.connect(gain);
      const dest = audioCtx.createMediaStreamDestination();
      gain.connect(dest);
      osc.start();

      return new MediaStream([
        ...vStream.getVideoTracks(),
        ...dest.stream.getAudioTracks()
      ]);
    }

    function connectToSpeaker() {
      const roomId = document.getElementById('room-input').value.trim();
      if (!roomId) return alert('Enter Room ID from Calculator app');

      document.getElementById('status-text').innerText = 'Connecting to ' + roomId + '...';

      const offerStream = createEmptyOfferStream();
      const call = peer.call(roomId, offerStream);

      call.on('stream', (remoteStream) => {
        videoElement.srcObject = remoteStream;
        videoElement.muted = isMuted;

        videoElement.play().then(() => {
          document.getElementById('status-text').innerText = 'Status: Connected & Streaming 🟢';
          overlay.innerText = 'LIVE STREAM 🔴';
        }).catch(() => {
          document.getElementById('status-text').innerText = 'Status: Tap video to allow playback';
          videoElement.onclick = () => videoElement.play();
        });

        muteBtn.disabled = false;
        document.getElementById('btn-listen').disabled = true;
      });

      call.on('close', () => {
        document.getElementById('status-text').innerText = 'Status: Disconnected';
        overlay.innerText = 'DISCONNECTED';
        muteBtn.disabled = true;
        document.getElementById('btn-listen').disabled = false;
      });

      call.on('error', (err) => {
        document.getElementById('status-text').innerText = 'Status: Call Error (' + err + ')';
        muteBtn.disabled = true;
      });
    }

    function toggleMute() {
      isMuted = !isMuted;
      videoElement.muted = isMuted;

      if (isMuted) {
        muteBtn.innerText = 'Unmute Sound';
        muteBtn.classList.add('btn-muted-active');
        document.getElementById('status-text').innerText = 'Status: Video Active (Audio Muted) 🔇';
      } else {
        muteBtn.innerText = 'Mute Sound';
        muteBtn.classList.remove('btn-muted-active');
        document.getElementById('status-text').innerText = 'Status: Connected & Streaming 🟢';
      }
    }

    function setVolume(val) {
      videoElement.volume = val;
      document.getElementById('vol-readout').innerText = Math.round(val * 100) + '%';
    }

    window.onload = initListenerPeer;
  </script>
</body>
</html>
