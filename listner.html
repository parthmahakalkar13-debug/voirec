<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraCast Listener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg: #0a0d14;
      --card: #121826;
      --primary: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
    h2 { font-size: 1.25rem; font-weight: 700; }
    input { background: #1a2336; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; color: #fff; font-size: 1rem; outline: none; width: 100%; }
    button { background: var(--primary); color: #fff; font-weight: 600; border: none; border-radius: 8px; padding: 14px; font-size: 1rem; cursor: pointer; transition: 0.2s ease; }
    button:disabled { opacity: 0.5; }
    .status-badge { font-size: 0.8125rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Listener Hub</h2>
    <input type="text" id="room-input" placeholder="Enter Room ID (e.g. aura-xxxx)" />
    <button id="btn-listen" onclick="connectToSpeaker()">Start Listening</button>
    <div id="status-text" class="status-badge">Status: Idle</div>
    <audio id="remote-audio" autoplay playsinline></audio>
  </div>

  <script>
    let peer = null;

    function initListenerPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });
      peer.on('open', () => {
        document.getElementById('status-text').innerText = 'Status: Ready to connect';
      });
    }

    function connectToSpeaker() {
      const roomId = document.getElementById('room-input').value.trim();
      if (!roomId) return alert('Please enter the Room ID displayed in the calculator app');

      document.getElementById('status-text').innerText = 'Status: Connecting to ' + roomId + '...';

      // Create an empty dummy audio track to start the WebRTC handshake
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const dest = ctx.createMediaStreamDestination();
      const call = peer.call(roomId, dest.stream);

      call.on('stream', (remoteStream) => {
        const player = document.getElementById('remote-audio');
        player.srcObject = remoteStream;
        player.play().then(() => {
          document.getElementById('status-text').innerText = 'Status: Live audio playing 🔴';
        }).catch(err => {
          console.warn('Playback error:', err);
          document.getElementById('status-text').innerText = 'Status: Click anywhere on screen to hear';
        });
      });

      call.on('error', (err) => {
        document.getElementById('status-text').innerText = 'Status: Connection error (' + err + ')';
      });
    }

    window.onload = initListenerPeer;
  </script>
</body>
</html>
