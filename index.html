<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraCast — Speaker Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-base: #0a0d14;
      --bg-surface: rgba(18, 24, 38, 0.75);
      --bg-elevated: rgba(26, 35, 54, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: var(--bg-base);
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px;
    }

    .container { width: 100%; max-width: 780px; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), #a855f7);
      border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 16px var(--primary-glow);
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 22px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card-title { font-size: 1rem; font-weight: 600; color: var(--text-main); }

    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    }
    .badge-idle { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.2); }
    .badge-live { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 1.5s infinite; }

    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } 100% { opacity: 1; } }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    input, select {
      background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
      padding: 10px 14px; color: var(--text-main); font-size: 0.875rem; outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .toggles-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .toggle-chip {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px;
      background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
      cursor: pointer; font-size: 0.8125rem; user-select: none;
    }
    .toggle-chip input { display: none; }
    .toggle-chip.active { border-color: var(--primary); background: rgba(99, 102, 241, 0.15); color: #fff; }

    .btn-group { display: flex; gap: 12px; margin-top: 14px; }
    .btn {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 18px; border-radius: var(--radius-sm); font-size: 0.875rem; font-weight: 600;
      cursor: pointer; border: none; transition: 0.2s ease;
    }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 14px var(--primary-glow); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--bg-elevated); border: 1px solid var(--border-subtle); color: var(--text-main); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .visualizer-container { background: #06080d; border-radius: var(--radius-md); padding: 12px; border: 1px solid var(--border-subtle); margin: 12px 0; }
    canvas { width: 100%; height: 64px; display: block; }

    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    @media (max-width: 600px) { .metrics-grid { grid-template-columns: repeat(2, 1fr); } }
    .metric-card { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 10px; }
    .metric-label { font-size: 0.6875rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }
    .metric-value { font-family: 'JetBrains Mono', monospace; font-size: 0.9375rem; color: var(--text-main); font-weight: 500; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </div>
        <div>
          <h2>AuraCast Speaker</h2>
          <p style="font-size: 0.8125rem; color: var(--text-muted);">Real-Time Audio Broadcaster</p>
        </div>
      </div>
      <span id="speaker-badge" class="badge badge-idle">Ready to Broadcast</span>
    </header>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Session Key & Uplink</div>
      </div>
      <div class="form-grid">
        <div class="field">
          <label>Your Room ID (Share with Listener)</label>
          <input type="text" id="speaker-room-code" readonly placeholder="Generating ID..." />
        </div>
        <div class="field">
          <label>Connected Listeners</label>
          <input type="text" id="listener-count" readonly value="0 listeners" />
        </div>
      </div>

      <div class="btn-group">
        <button id="btn-start" class="btn btn-primary" onclick="startBroadcast()">Start Live Stream</button>
        <button id="btn-mute" class="btn btn-secondary" onclick="toggleMute()" disabled>Mute Mic</button>
        <button id="btn-stop" class="btn btn-danger" onclick="stopBroadcast()" disabled>End Stream</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom: 12px;">Audio Hardware & Filters</div>
      <div class="field">
        <label>Microphone Input</label>
        <select id="audio-input-select"></select>
      </div>

      <div class="toggles-list">
        <label class="toggle-chip active" id="chip-aec"><input type="checkbox" id="toggle-aec" checked> Echo Cancellation</label>
        <label class="toggle-chip active" id="chip-ns"><input type="checkbox" id="toggle-ns" checked> Noise Suppression</label>
        <label class="toggle-chip active" id="chip-agc"><input type="checkbox" id="toggle-agc" checked> Auto Gain Control</label>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Live VU Meter & Stream Telemetry</div>
      <div class="visualizer-container">
        <canvas id="speaker-canvas"></canvas>
      </div>
      <div class="metrics-grid">
        <div class="metric-card"><div class="metric-label">Codec</div><div class="metric-value">Opus 48kHz</div></div>
        <div class="metric-card"><div class="metric-label">Bitrate</div><div class="metric-value" id="stat-bitrate">0 kbps</div></div>
        <div class="metric-card"><div class="metric-label">Estimated Latency</div><div class="metric-value">&lt; 35 ms</div></div>
        <div class="metric-card"><div class="metric-label">Sample Rate</div><div class="metric-value">48,000 Hz</div></div>
      </div>
    </div>
  </div>

  <script>
    let peer = null;
    let localStream = null;
    let activeCalls = [];
    let audioCtx = null;
    let animId = null;

    ['toggle-aec', 'toggle-ns', 'toggle-agc'].forEach(id => {
      document.getElementById(id).addEventListener('change', e => {
        e.target.parentElement.classList.toggle('active', e.target.checked);
      });
    });

    async function loadDevices() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const select = document.getElementById('audio-input-select');
        select.innerHTML = '';
        devices.filter(d => d.kind === 'audioinput').forEach((d, i) => {
          const opt = document.createElement('option');
          opt.value = d.deviceId;
          opt.text = d.label || `Microphone ${i + 1}`;
          select.appendChild(opt);
        });
      } catch (err) { console.warn(err); }
    }

    function initPeer() {
      const roomKey = 'aura-' + Math.random().toString(36).substring(2, 7);
      peer = new Peer(roomKey);
      peer.on('open', id => document.getElementById('speaker-room-code').value = id);

      peer.on('call', call => {
        if (localStream) {
          call.answer(localStream);
          activeCalls.push(call);
          updateCount();
          call.on('close', () => {
            activeCalls = activeCalls.filter(c => c !== call);
            updateCount();
          });
        }
      });
    }

    function updateCount() {
      document.getElementById('listener-count').value = `${activeCalls.length} listener(s) connected`;
    }

    async function startBroadcast() {
      try {
        const deviceId = document.getElementById('audio-input-select').value;
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            echoCancellation: document.getElementById('toggle-aec').checked,
            noiseSuppression: document.getElementById('toggle-ns').checked,
            autoGainControl: document.getElementById('toggle-agc').checked,
            sampleRate: 48000
          },
          video: false
        });

        drawVisualizer(localStream);
        await loadDevices();

        document.getElementById('speaker-badge').className = 'badge badge-live';
        document.getElementById('speaker-badge').innerText = 'Live Broadcasting';
        document.getElementById('btn-start').disabled = true;
        document.getElementById('btn-mute').disabled = false;
        document.getElementById('btn-stop').disabled = false;
        document.getElementById('stat-bitrate').innerText = '128 kbps';
      } catch (e) {
        alert('Microphone Access Failed: ' + e.message);
      }
    }

    function toggleMute() {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      track.enabled = !track.enabled;
      const btn = document.getElementById('btn-mute');
      btn.innerText = track.enabled ? 'Mute Mic' : 'Unmute Mic';
      btn.classList.toggle('btn-danger', !track.enabled);
    }

    function stopBroadcast() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      activeCalls.forEach(c => c.close());
      activeCalls = [];
      updateCount();

      document.getElementById('speaker-badge').className = 'badge badge-idle';
      document.getElementById('speaker-badge').innerText = 'Ready to Broadcast';
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-mute').disabled = true;
      document.getElementById('btn-stop').disabled = true;
      document.getElementById('stat-bitrate').innerText = '0 kbps';
      cancelAnimationFrame(animId);
    }

    function drawVisualizer(stream) {
      const canvas = document.getElementById('speaker-canvas');
      const ctx = canvas.getContext('2d');
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      source.connect(analyser);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function render() {
        animId = requestAnimationFrame(render);
        analyser.getByteFrequencyData(dataArray);
        ctx.fillStyle = '#06080d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (dataArray[i] / 255) * canvas.height;
          ctx.fillStyle = '#6366f1';
          ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
          x += barWidth;
        }
      }
      render();
    }

    window.onload = () => { initPeer(); loadDevices(); };
  </script>
</body>
</html>
