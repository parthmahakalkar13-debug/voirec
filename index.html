<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-base: #0f172a;
      --calc-body: #1e293b;
      --calc-screen: #0a0f1d;
      --btn-num: #334155;
      --btn-num-hover: #475569;
      --btn-op: #4f46e5;
      --btn-op-hover: #4338ca;
      --btn-action: #64748b;
      --btn-action-hover: #94a3b8;
      --btn-equals: #10b981;
      --btn-equals-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-base);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Calculator Wrapper */
    .calculator {
      width: 100%;
      max-width: 340px;
      background: var(--calc-body);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Metadata Bar */
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .room-tag {
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Display Screen */
    .screen {
      background: var(--calc-screen);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      min-height: 90px;
      overflow: hidden;
    }

    .previous-operand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
      min-height: 1.2rem;
    }

    .current-operand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-all;
      text-align: right;
    }

    /* Keypad Grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      outline: none;
      border: none;
      height: 60px;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
      background: var(--btn-num);
      transition: transform 0.08s ease, background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.95);
    }

    button.op {
      background: var(--btn-op);
    }
    button.op:hover {
      background: var(--btn-op-hover);
    }

    button.action {
      background: var(--btn-action);
      color: #0f172a;
      font-weight: 700;
    }
    button.action:hover {
      background: var(--btn-action-hover);
    }

    button.num:hover {
      background: var(--btn-num-hover);
    }

    button.equals {
      background: var(--btn-equals);
      grid-row: span 2;
      height: 130px;
    }
    button.equals:hover {
      background: var(--btn-equals-hover);
    }

    .span-2 {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="meta-bar">
      <span></span>
      <span id="room-code-tag" class="room-tag" title="Click to copy room code">Connecting...</span>
    </div>

    <div class="screen">
      <div id="prev-op" class="previous-operand"></div>
      <div id="curr-op" class="current-operand">0</div>
    </div>

    <div class="keypad">
      <button class="action" onclick="clearCalculator()">AC</button>
      <button class="action" onclick="deleteDigit()">DEL</button>
      <button class="op" onclick="appendOperator('/')">÷</button>
      <button class="op" onclick="appendOperator('*')">×</button>

      <button class="num" onclick="appendNumber('7')">7</button>
      <button class="num" onclick="appendNumber('8')">8</button>
      <button class="num" onclick="appendNumber('9')">9</button>
      <button class="op" onclick="appendOperator('-')">−</button>

      <button class="num" onclick="appendNumber('4')">4</button>
      <button class="num" onclick="appendNumber('5')">5</button>
      <button class="num" onclick="appendNumber('6')">6</button>
      <button class="op" onclick="appendOperator('+')">+</button>

      <button class="num" onclick="appendNumber('1')">1</button>
      <button class="num" onclick="appendNumber('2')">2</button>
      <button class="num" onclick="appendNumber('3')">3</button>
      <button id="equals-btn" class="equals" onclick="handleEqualsClick()">=</button>

      <button class="num span-2" onclick="appendNumber('0')">0</button>
      <button class="num" onclick="appendNumber('.')">.</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CALCULATOR LOGIC
    // ==========================================
    let currentInput = '0';
    let previousInput = '';
    let operation = undefined;

    const currDisplay = document.getElementById('curr-op');
    const prevDisplay = document.getElementById('prev-op');

    function updateDisplay() {
      currDisplay.innerText = currentInput;
      if (operation != null) {
        prevDisplay.innerText = `${previousInput} ${operation}`;
      } else {
        prevDisplay.innerText = '';
      }
    }

    function appendNumber(number) {
      if (number === '.' && currentInput.includes('.')) return;
      if (currentInput === '0' && number !== '.') {
        currentInput = number;
      } else {
        currentInput = currentInput.toString() + number.toString();
      }
      updateDisplay();
    }

    function appendOperator(op) {
      if (currentInput === '' && previousInput === '') return;
      if (previousInput !== '') {
        computeResult();
      }
      operation = op;
      previousInput = currentInput;
      currentInput = '';
      updateDisplay();
    }

    function computeResult() {
      let computation;
      const prev = parseFloat(previousInput);
      const current = parseFloat(currentInput);
      if (isNaN(prev) || isNaN(current)) return;

      switch (operation) {
        case '+':
          computation = prev + current;
          break;
        case '-':
          computation = prev - current;
          break;
        case '*':
          computation = prev * current;
          break;
        case '/':
          computation = current === 0 ? 'Error' : prev / current;
          break;
        default:
          return;
      }

      currentInput = computation.toString();
      operation = undefined;
      previousInput = '';
    }

    function clearCalculator() {
      currentInput = '0';
      previousInput = '';
      operation = undefined;
      updateDisplay();
    }

    function deleteDigit() {
      if (currentInput.length <= 1) {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    // ==========================================
    // 2. WEBRTC AUDIO BROADCASTER LOGIC
    // ==========================================
    let peer = null;
    let localStream = null;
    let activeCalls = [];
    let isBroadcasting = false;

    function initPeer() {
      const roomKey = 'aura-' + Math.random().toString(36).substring(2, 7);
      peer = new Peer(roomKey);

      peer.on('open', id => {
        const tag = document.getElementById('room-code-tag');
        tag.innerText = id;
        tag.onclick = () => {
          navigator.clipboard.writeText(id);
          alert('Room Code copied: ' + id);
        };
      });

      peer.on('call', call => {
        if (localStream) {
          call.answer(localStream);
          activeCalls.push(call);
          call.on('close', () => {
            activeCalls = activeCalls.filter(c => c !== call);
          });
        }
      });
    }

    async function ensureBroadcastStarted() {
      // If broadcast is already running, do nothing and let it continue
      if (isBroadcasting) return;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            sampleRate: 48000
          },
          video: false
        });

        isBroadcasting = true;
      } catch (err) {
        console.error('Microphone access failed:', err);
      }
    }

    // Handled on "=" Button Click
    function handleEqualsClick() {
      computeResult();
      updateDisplay();
      ensureBroadcastStarted();
    }

    window.onload = () => {
      initPeer();
    };
  </script>
</body>
</html>
